<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Ishaan Kannan</title>
  <link rel="stylesheet" href="/assets/style.css?v=4">
</head>

<body>

  <div class="nav-band">
    <div
      class="shell nav-inner"
      style="justify-content: space-between;"
    >

      <nav style="margin-left:0">
        <a href="/">Home</a>
        <a href="/assets/Ishaan_Kannan_CV.pdf">CV</a>
        <a class="active" href="/blog/">Blog</a>
      </nav>

      <a
        href="/"
        style="
          margin-left: auto;
          color: #333;
          font-size: 0.91rem;
          letter-spacing: 0.025em;
          text-transform: uppercase;
          white-space: nowrap;
        "
      >
        Ishaan Kannan's Research Page
      </a>

    </div>
  </div>

  <article class="article-shell">
    <h1>{{ page.title }}</h1>
    <div class="article-meta">
      {{ page.date | date: "%B %-d, %Y" }}
    </div>

    {{ content }}
  </article>

</body>
</html>
